spring:
  application:
    name: irifams

  datasource:
    url: jdbc:mysql://localhost:3306/irifams_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: false

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace

app:
  jwt:
    secret: 1234567891234567891234567891234567891234567891234567891234567891
    expiration: 2400000